version: "3.9"
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: disaster-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: disaster_response
    volumes:
      - disaster_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  disaster_data:
